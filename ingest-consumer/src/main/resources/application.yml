server:
  port: 8080

app:
  topic: doc.changes
  # Resolved relative to the working directory. IntelliJ runs with the working
  # directory set to the project root, so this points at rag-sync/data/blobs.
  blob-dir: data/blobs
  chunk:
    target-size: 1000
    max-size: 1500
  # --- week 3 -------------------------------------------------------------
  # Both providers are swapped by config alone. Nothing else in the pipeline
  # knows which is running.
  embedding:
    provider: ollama              # ollama | azure
    dimensions: 768               # MUST match the vector(N) width in schema.sql
    batch-size: 16
    max-attempts: 4
    ollama:
      base-url: http://localhost:11434
      model: nomic-embed-text
    azure:
      endpoint: ${FOUNDRY_ENDPOINT:}
      api-key: ${FOUNDRY_API_KEY:}
      deployment: ${FOUNDRY_EMBEDDING_DEPLOYMENT:text-embedding-3-small}
      api-version: ${FOUNDRY_API_VERSION:2024-02-01}
  store:
    provider: pgvector            # pgvector | (azure-search, later)
    batch-size: 200

  normalize:
    # A URL fragment or query must be at least this long AND almost entirely
    # encoding-alphabet characters before it is treated as opaque. Both
    # conditions, deliberately: "looks like base64" alone would catch JWTs,
    # hashes and legitimate encoding examples.
    opaque-fragment-threshold: 200
    encoded-ratio: 0.95

spring:
  application:
    name: ingest-consumer
  datasource:
    url: jdbc:postgresql://localhost:5432/ragsync
    username: ragsync
    password: ragsync
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ingest-consumer-v4
      auto-offset-reset: earliest
      # manual commits only: the offset moves when we say the work is done,
      # not when the poll loop happens to come around again
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer stops one malformed record from poisoning the
      # partition forever. Week 5 turns this into a real dead-letter topic.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.ragsync.ingest.model.DocChangeEvent
        spring.json.trusted.packages: com.ragsync.ingest.model
        max.poll.records: 500
    listener:
      ack-mode: manual
      # Dropped to 1 for the first embedding run. Three threads triple the
      # request rate into a model whose throughput you have not measured yet,
      # and a slower run is easier to reason about than intermittent failures.
      # Raise it once you know what Ollama sustains on your machine.
      concurrency: 1

logging:
  level:
    com.ragsync.ingest: INFO
    org.springframework.jdbc: WARN
    org.apache.kafka: WARN
