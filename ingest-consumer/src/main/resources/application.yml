server:
  port: 8080

app:
  topic: doc.changes
  # Resolved relative to the working directory. IntelliJ runs with the working
  # directory set to the project root, so this points at rag-sync/data/blobs.
  blob-dir: data/blobs
  chunk:
    target-size: 1000
    max-size: 1500
  normalize:
    # A URL fragment or query must be at least this long AND almost entirely
    # encoding-alphabet characters before it is treated as opaque. Both
    # conditions, deliberately: "looks like base64" alone would catch JWTs,
    # hashes and legitimate encoding examples.
    opaque-fragment-threshold: 200
    encoded-ratio: 0.95

spring:
  application:
    name: ingest-consumer
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ingest-consumer-v3
      auto-offset-reset: earliest
      # manual commits only: the offset moves when we say the work is done,
      # not when the poll loop happens to come around again
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer stops one malformed record from poisoning the
      # partition forever. Week 5 turns this into a real dead-letter topic.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.ragsync.ingest.model.DocChangeEvent
        spring.json.trusted.packages: com.ragsync.ingest.model
        max.poll.records: 500
    listener:
      ack-mode: manual
      concurrency: 3

logging:
  level:
    com.ragsync.ingest: INFO
    org.apache.kafka: WARN
